apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-smf
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  smf-dashboard.json: |
    {
      "title": "SMF Monitoring",
      "panels": [
        {
          "type": "timeseries",
          "title": "CPU Usage",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total{namespace=\"5gc\", pod=~\"smf-.*\"}[1m])",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory Usage (MB)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "container_memory_usage_bytes{namespace=\"5gc\", pod=~\"smf-.*\"} / 1024 / 1024",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Network Receive Rate (KB/s)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "rate(container_network_receive_bytes_total{namespace=\"5gc\", pod=~\"smf-.*\"}[1m]) / 1024",
              "legendFormat": "{{pod}} IN"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Network Transmit Rate (KB/s)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "rate(container_network_transmit_bytes_total{namespace=\"5gc\", pod=~\"smf-.*\"}[1m]) / 1024",
              "legendFormat": "{{pod}} OUT"
            }
          ]
        }
      ]
    }
