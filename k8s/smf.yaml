apiVersion: apps/v1
kind: Deployment
metadata:
  name: smf
  namespace: 5gc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smf
  template:
    metadata:
      labels:
        app: smf
    spec:
      containers:
        - name: smf
          image: 5gc-nf:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/smf"]
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: 5gc-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: smf
  namespace: 5gc
spec:
  selector:
    app: smf
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smf-hpa
  namespace: 5gc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smf
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
